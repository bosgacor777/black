<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Kosakata Oxford 3000</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .controls {
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }
        .flashcard {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 40px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(110, 142, 251, 0.4);
            word-wrap: break-word;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border 0.3s;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #6e8efb;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6e8efb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #5a75d9;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
        .stats {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tebak Arti Kata</h2>
    
    <div class="controls">
        <select id="levelSelect" onchange="changeLevel()">
            <option value="All">Semua Level (A-F)</option>
            <option value="A">Awalan A</option>
            <option value="B">Awalan B</option>
            <option value="C">Awalan C</option>
            <option value="D">Awalan D</option>
            <option value="E">Awalan E</option>
            <option value="F">Awalan F</option>
        </select>
    </div>

    <div class="flashcard" id="wordDisplay">Loading...</div>
    
    <input type="text" id="answerInput" placeholder="Ketik arti bahasa Indonesianya..." autocomplete="off" onkeypress="handleKeyPress(event)">
    <button onclick="checkAnswer()">Cek Jawaban</button>
    
    <div class="feedback" id="feedbackText"></div>
    
    <div class="stats">
        <span id="scoreText">Skor: 0</span>
        <span id="remainingText">Sisa Kata: 0</span>
    </div>
</div>

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function changeLevel() {
        const selectedLevel = document.getElementById('levelSelect').value;
        
        if (selectedLevel === "All") {
            currentList = [...databaseKosakata];
        } else {
            currentList = databaseKosakata.filter(item => item.level === selectedLevel);
        }
        
        currentList = shuffleArray(currentList);
        score = 0;
        updateScore();
        nextWord();
    }

        document.getElementById('wordDisplay').innerText = currentWordObj.word;
        document.getElementById('answerInput').value = "";
        document.getElementById('answerInput').focus();
        updateScore();
    }

    function checkAnswer() {
        const input = document.getElementById('answerInput').value.trim().toLowerCase();
        const correctAnswer = currentWordObj.meaning.toLowerCase();
        
        const possibleAnswers = correctAnswer.split(',').map(ans => ans.trim());
        const feedbackEl = document.getElementById('feedbackText');

        if (input === "") {
            feedbackEl.innerText = "Ketik jawabanmu dulu!";
            feedbackEl.className = "feedback wrong";
            return;
        }

        if (possibleAnswers.includes(input)) {
            feedbackEl.innerText = "Benar! Artinya: " + currentWordObj.meaning;
            feedbackEl.className = "feedback correct";
            score += 10;
            setTimeout(nextWord, 1500);
        } else {
            feedbackEl.innerText = "Salah! Coba lagi.";
            feedbackEl.className = "feedback wrong";
            currentList.unshift(currentWordObj); 
        }
        updateScore();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    }

    function updateScore() {
        document.getElementById('scoreText').innerText = `Skor: ${score}`;
        document.getElementById('remainingText').innerText = `Sisa Kata: ${currentList.length}`;
    }

    window.onload = function() {
        changeLevel();
    };
</script>

</body>
</html>
