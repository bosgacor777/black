<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Part of Speech Vocab - Full Version</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-sizing: border-box;
            margin: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .score-board {
            font-size: 1rem;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 1.5rem;
            background-color: #e0e7ff;
            padding: 0.5rem;
            border-radius: 0.5rem;
        }

        .card {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .word-id {
            font-size: 1.2rem;
            color: #4b5563;
            font-style: italic;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .btn-option {
            background-color: #ffffff;
            border: 2px solid #d1d5db;
            color: var(--text-color);
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #e0e7ff;
            transform: translateY(-2px);
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-option.correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
        }

        .btn-option.wrong {
            background-color: var(--error) !important;
            border-color: var(--error) !important;
            color: white !important;
        }

        #feedback {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            min-height: 1.5rem;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }

        .end-screen {
            display: none;
        }

        .end-screen h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .end-screen p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #4b5563;
        }
    </style>
</head>

            </div>

            <div id="feedback"></div>
