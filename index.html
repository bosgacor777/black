<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebak Jenis Kata — 200 Kosakata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E7EDE8;
    --bg-2: #DCE5DD;
    --card: #FFFDF7;
    --rule: #E1DFD3;
    --ink: #22291F;
    --ink-soft: #5C6459;
    --ink-faint: #8B9285;
    --line: #C9D1C6;
    --chrome: #24405C;
    --chrome-hover: #1B324A;
    --wrong: #A73B2E;
    --shadow: 0 18px 40px -20px rgba(34,41,31,0.35);

    --noun: #2C5F8A;    --noun-bg: #E4EDF4;
    --verb: #B3401E;    --verb-bg: #F6E7E0;
    --adj:  #2F7A4F;    --adj-bg:  #E3F0E8;
    --adv:  #7A4FA0;    --adv-bg:  #EEE6F4;
    --pron: #B0397A;    --pron-bg: #F3E3EE;
    --prep: #1A8A8A;    --prep-bg: #E0F0F0;
    --conj: #C77B14;    --conj-bg: #F7ECDA;
    --art:  #5B5344;    --art-bg:  #EAE7DD;
  }

  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; padding:28px 14px;
    display:flex; justify-content:center; align-items:flex-start;
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--bg-2), var(--bg) 60%);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  .app{width:100%; max-width:480px;}

  header{ text-align:center; margin-bottom:16px; }
  header h1{
    font-family:'Lora', serif; font-weight:700; font-size:1.5rem;
    margin:0 0 4px; letter-spacing:-0.01em;
  }
  header p{ margin:0; color:var(--ink-soft); font-size:0.85rem; }

  /* segmented mode control */
  .mode-switch{
    display:flex; flex-wrap:wrap; background:#DEE5DB; border-radius:14px; padding:4px;
    margin:18px 0 14px; position:relative; gap:0;
  }
  .mode-switch button{
    flex:1 1 50%; border:none; background:transparent; padding:9px 4px;
    font-family:inherit; font-size:0.72rem; font-weight:600; color:var(--ink-soft);
    border-radius:10px; cursor:pointer; transition:color .15s ease;
    position:relative; z-index:1; white-space:normal; line-height:1.2;
  }
  .mode-switch button.active{ color:#fff; }
  .mode-switch .thumb{
    position:absolute; top:4px; left:4px;
    width:calc(50% - 4px); height:calc(50% - 4px);
    background:var(--chrome); border-radius:10px;
    transition:transform .25s cubic-bezier(.4,0,.2,1); z-index:0;
  }
  .mode-switch button:disabled{ cursor:not-allowed; opacity:0.55; }

  /* progress */
  .progress-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:0.78rem; color:var(--ink-soft); margin-bottom:6px;
  }
  .progress-row strong{ color:var(--ink); font-weight:600; }
  .progress-track{
    height:5px; background:var(--rule); border-radius:999px; overflow:hidden;
    margin-bottom:18px;
  }
  .progress-fill{
    height:100%; background:var(--chrome); border-radius:999px;
    transition:width .35s ease;
  }

  /* card */
  .card{
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    padding:30px 24px 26px; position:relative; overflow:hidden;
    background-image: repeating-linear-gradient(
      to bottom, transparent 0 41px, var(--rule) 41px 42px
    );
    background-position: 0 78px;
  }
  .pos-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:0.72rem;
    padding:3px 10px; border-radius:999px; margin-bottom:14px;
    opacity:0; transform:translateY(-4px); transition:all .25s ease;
  }
  .pos-tag.show{ opacity:1; transform:translateY(0); }

  .word-en{
    font-family:'Lora', serif; font-weight:700; font-size:2.1rem;
    line-height:1.1; margin:0 0 8px; word-break:break-word;
  }
  .word-id{
    font-family:'Lora', serif; font-style:italic; font-weight:500;
    font-size:1.05rem; color:var(--ink-soft); margin:0;
  }

  /* answer zone */
  .answer-zone{ margin-top:24px; }

  .options-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .btn-option{
    background:#fff; border:1.5px solid var(--line); color:var(--ink);
    padding:11px 8px; font-family:inherit; font-size:0.83rem; font-weight:600;
    border-radius:9px; cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .btn-option:hover:not(:disabled){ border-color:var(--chrome); background:#F3F6F1; }
  .btn-option:disabled{ cursor:default; }
  .btn-option.correct{ background:var(--adj); border-color:var(--adj); color:#fff; }
  .btn-option.wrong{ background:var(--wrong); border-color:var(--wrong); color:#fff; }

  .type-row{ display:flex; gap:8px; }
  .type-row input{
    flex:1; border:1.5px solid var(--line); border-radius:9px;
    padding:12px 14px; font-family:inherit; font-size:0.95rem; color:var(--ink);
    background:#fff; outline:none; transition:border-color .15s ease;
  }
  .type-row input:focus{ border-color:var(--chrome); }
  .type-row input.correct{ border-color:var(--adj); background:var(--adj-bg); }
  .type-row input.wrong{ border-color:var(--wrong); background:#F7E4E0; }
  .type-row button{
    border:none; background:var(--chrome); color:#fff; font-family:inherit;
    font-weight:600; font-size:0.9rem; padding:0 18px; border-radius:9px;
    cursor:pointer; transition:background .15s ease;
  }
  .type-row button:hover:not(:disabled){ background:var(--chrome-hover); }
  .type-row button:disabled{ opacity:0.5; cursor:default; }
  .type-hint{ font-size:0.72rem; color:var(--ink-faint); margin:8px 2px 0; }

  .field-group{ margin-bottom:10px; }
  .field-label{
    font-size:0.72rem; color:var(--ink-faint); font-weight:600;
    margin:0 0 4px 2px; display:block;
  }
  .field-group input{
    width:100%; border:1.5px solid var(--line); border-radius:9px;
    padding:12px 14px; font-family:inherit; font-size:0.95rem; color:var(--ink);
    background:#fff; outline:none; transition:border-color .15s ease;
  }
  .field-group input:focus{ border-color:var(--chrome); }
  .field-group input.correct{ border-color:var(--adj); background:var(--adj-bg); }
  .field-group input.wrong{ border-color:var(--wrong); background:#F7E4E0; }
  .btn-check{
    width:100%; border:none; background:var(--chrome); color:#fff; font-family:inherit;
    font-weight:700; font-size:0.9rem; padding:12px; border-radius:9px; cursor:pointer;
    margin-top:4px; transition:background .15s ease;
  }
  .btn-check:hover:not(:disabled){ background:var(--chrome-hover); }
  .btn-check:disabled{ opacity:0.5; cursor:default; }

  #feedback{
    font-weight:600; font-size:0.92rem; min-height:1.3rem;
    margin-top:14px;
  }
  #feedback.ok{ color:var(--adj); }
  #feedback.no{ color:var(--wrong); }

  .btn-next{
    display:none; width:100%; margin-top:14px; border:none;
    background:var(--chrome); color:#fff; font-family:inherit; font-weight:700;
    font-size:0.95rem; padding:13px; border-radius:10px; cursor:pointer;
    transition:background .15s ease;
  }
  .btn-next:hover{ background:var(--chrome-hover); }

  /* end screen */
  .end-screen{ display:none; }
  .end-card{
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    padding:34px 24px; text-align:center;
  }
  .end-card h2{
    font-family:'Lora', serif; font-size:1.4rem; margin:0 0 20px;
  }
  .ring-wrap{ position:relative; width:150px; height:150px; margin:0 auto 20px; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--rule); stroke-width:10; }
  .ring-fg{ fill:none; stroke:var(--chrome); stroke-width:10; stroke-linecap:round;
    transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring-label .num{ font-family:'Lora', serif; font-weight:700; font-size:1.8rem; }
  .ring-label .den{ font-size:0.78rem; color:var(--ink-soft); }
  .end-card p{ color:var(--ink-soft); font-size:0.85rem; margin:0 0 22px; }
  .btn-end-action{
    width:100%; border:none; background:var(--chrome); color:#fff;
    font-family:inherit; font-weight:700; font-size:0.92rem; padding:14px;
    border-radius:10px; cursor:pointer; transition:background .15s ease;
  }
  .btn-end-action:hover{ background:var(--chrome-hover); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
  button:focus-visible, input:focus-visible{
    outline:2px solid var(--chrome); outline-offset:2px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tebak Jenis Kata</h1>
    <p id="subtitle">Kosakata bahasa Inggris · latihan bertahap per sesi</p>
  </header>

  <div class="mode-switch">
    <div class="thumb" id="mode-thumb"></div>
    <button id="mode-mc" class="active" onclick="setMode('mc')">Pilihan Ganda</button>
    <button id="mode-type" onclick="setMode('type')">Ketik Jawaban</button>
    <button id="mode-noid" onclick="setMode('noid')">Tanpa Arti</button>
    <button id="mode-full" onclick="setMode('full')">Tulis POS &amp; Arti</button>
  </div>

  <div id="quiz-screen">
    <div class="progress-row">
      <span>Sesi <strong id="current-session">1</strong>/<span id="total-sessions">4</span> · Soal <strong id="current-q">1</strong>/<span id="total-q">50</span></span>
      <span>Skor <strong id="score">0</strong></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="card">
      <span class="pos-tag" id="pos-tag"></span>
      <div class="word-en" id="word-en">Memuat…</div>
      <div class="word-id" id="word-id">Arti: …</div>

      <div class="answer-zone" id="answer-zone"></div>

      <div id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Pertanyaan selanjutnya →</button>
    </div>
  </div>

  <div class="end-screen" id="end-screen">
    <div class="end-card">
      <h2>Sesi <span id="finished-session">1</span> selesai 🎉</h2>
      <div class="ring-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="ring-bg" cx="75" cy="75" r="62"></circle>
          <circle class="ring-fg" id="ring-fg" cx="75" cy="75" r="62"

        <div class="ring-label">
          <span class="num" id="final-score">0</span>
          <span class="den">dari <span id="max-score">50</span></span>
        </div>
      </div>
      <p id="end-note">Terus lanjut, kamu makin hafal!</p>
      <button class="btn-end-action" id="btn-end-action"></button>
    </div>
  </div>
</div>

const allPosOptions = Object.keys(posMeta);

const questionsPerSession = 50;
const totalSessions = Math.ceil(allVocabs.length / questionsPerSession);

let mode = 'mc'; // 'mc' | 'type' | 'noid' | 'full'
let masterPool = [];
let currentSession = 1;
let sessionVocabs = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(array){
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalize(str){
  return str.toLowerCase().trim().replace(/[.\-\/]/g, ' ').replace(/\s+/g, ' ').trim();
}

function acceptedMeanings(idStr){
  return idStr.split(/[,\/]/)
    .map(s => normalize(s.replace(/\(.*?\)/g, '')))
    .filter(Boolean);
}

function setMode(newMode){
  if (answered) return; // don't allow switching mid-feedback
  mode = newMode;
  document.getElementById('mode-mc').classList.toggle('active', mode === 'mc');
  document.getElementById('mode-type').classList.toggle('active', mode === 'type');
  document.getElementById('mode-noid').classList.toggle('active', mode === 'noid');
  document.getElementById('mode-full').classList.toggle('active', mode === 'full');
  const thumbX = (mode === 'type' || mode === 'full') ? '100%' : '0';
  const thumbY = (mode === 'noid' || mode === 'full') ? '100%' : '0';
  document.getElementById('mode-thumb').style.transform = `translate(${thumbX}, ${thumbY})`;
  updateWordIdVisibility();
  renderAnswerZone();
}

function updateWordIdVisibility(){
  document.getElementById('word-id').style.display = (mode === 'noid' || mode === 'full') ? 'none' : 'block';
}

function initFullQuiz(){
  masterPool = shuffle(allVocabs);
  currentSession = 1;
  document.getElementById('subtitle').innerText =
    `${allVocabs.length} kosakata bahasa Inggris · ${totalSessions} sesi latihan`;
  startSession();
}

function startSession(){
  const startIdx = (currentSession - 1) * questionsPerSession;
  const endIdx = startIdx + questionsPerSession;
  sessionVocabs = shuffle(masterPool.slice(startIdx, endIdx));

  currentIndex = 0;
  score = 0;

  document.getElementById('current-session').innerText = currentSession;
  document.getElementById('total-sessions').innerText = totalSessions;
  document.getElementById('total-q').innerText = sessionVocabs.length;
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('end-screen').style.display = 'none';

  loadQuestion();
}

function loadQuestion(){
  answered = false;
  document.getElementById('mode-mc').disabled = false;
  document.getElementById('mode-type').disabled = false;
  document.getElementById('mode-noid').disabled = false;
  document.getElementById('mode-full').disabled = false;
  document.getElementById('feedback').innerText = '';
  document.getElementById('feedback').className = '';
  document.getElementById('btn-next').style.display = 'none';

  const currentData = sessionVocabs[currentIndex];
  document.getElementById('current-q').innerText = currentIndex + 1;
  document.getElementById('score').innerText = score;
  document.getElementById('progress-fill').style.width = ((currentIndex) / sessionVocabs.length * 100) + '%';
  document.getElementById('word-en').innerText = currentData.en;
  document.getElementById('word-id').innerText = `Arti: ${currentData.id}`;
  updateWordIdVisibility();

  const tag = document.getElementById('pos-tag');
  tag.classList.remove('show');
  tag.innerText = '';
  tag.style.background = '';
  tag.style.color = '';

  renderAnswerZone();
}

function renderAnswerZone(){
  const zone = document.getElementById('answer-zone');
  zone.innerHTML = '';
  if (mode === 'mc' || mode === 'noid') {
    const grid = document.createElement('div');
    grid.className = 'options-grid';
    allPosOptions.forEach(pos => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = pos;
      btn.onclick = () => selectMC(pos, btn);
      grid.appendChild(btn);
    });
    zone.appendChild(grid);
  } else if (mode === 'type') {
    const row = document.createElement('div');
    row.className = 'type-row';
    row.innerHTML = `
      <input type="text" id="type-input" placeholder="Ketik jenis kata…" autocomplete="off" autocapitalize="off">
      <button id="type-submit">Cek</button>
    `;
    zone.appendChild(row);
    const hint = document.createElement('div');
    hint.className = 'type-hint';
    hint.innerText = 'Boleh pakai Bahasa Indonesia atau Inggris, mis. "kata benda" atau "noun".';
    zone.appendChild(hint);

    const input = document.getElementById('type-input');
    const submitBtn = document.getElementById('type-submit');
    submitBtn.onclick = () => submitType();
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitType(); });
    input.focus();
  } else if (mode === 'full') {
    zone.innerHTML = `
      <div class="field-group">
        <label class="field-label">Part of speech</label>
        <input type="text" id="full-pos" placeholder="mis. noun / kata benda" autocomplete="off" autocapitalize="off">
      </div>
      <div class="field-group">
        <label class="field-label">Arti (Bahasa Indonesia)</label>
        <input type="text" id="full-id" placeholder="tulis artinya…" autocomplete="off" autocapitalize="off">
      </div>
      <button class="btn-check" id="full-submit">Cek Jawaban</button>
    `;
    const posInput = document.getElementById('full-pos');
    const idInput = document.getElementById('full-id');
    document.getElementById('full-submit').onclick = () => submitFull();
    posInput.addEventListener('keydown', e => { if (e.key === 'Enter') idInput.focus(); });
    idInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitFull(); });
    posInput.focus();
  }
}

function revealPosTag(correctPos){
  const tag = document.getElementById('pos-tag');
  const meta = posMeta[correctPos];
  tag.innerText = `${meta.abbr} — ${correctPos}`;
  tag.style.background = meta.bg;
  tag.style.color = meta.color;
  tag.classList.add('show');
}

function selectMC(selected, selectedBtn){
  if (answered) return;
  answered = true;
  document.getElementById('mode-mc').disabled = true;
  document.getElementById('mode-type').disabled = true;
  document.getElementById('mode-noid').disabled = true;
  document.getElementById('mode-full').disabled = true;

  const correct = sessionVocabs[currentIndex].pos;
  const buttons = document.querySelectorAll('.btn-option');
  buttons.forEach(btn => {
    btn.disabled = true;
    if (correct === btn.innerText) btn.classList.add('correct');
  });

  revealPosTag(correct);
  const feedbackEl = document.getElementById('feedback');
  if (selected === correct) {
    score++;
    feedbackEl.className = 'ok';
    feedbackEl.innerText = 'Benar! Hebat 👏';
  } else {
    selectedBtn.classList.add('wrong');
    feedbackEl.className = 'no';
    feedbackEl.innerText = `Kurang tepat. Jawaban benar: ${correct}`;
  }

  document.getElementById('score').innerText = score;
  document.getElementById('btn-next').style.display = 'block';
}

function submitType(){
  if (answered) return;
  const input = document.getElementById('type-input');
  const typed = normalize(input.value);
  if (!typed) { input.focus(); return; }

  answered = true;
  document.getElementById('mode-mc').disabled = true;
  document.getElementById('mode-type').disabled = true;
  document.getElementById('mode-noid').disabled = true;
  document.getElementById('mode-full').disabled = true;
  document.getElementById('type-submit').disabled = true;
  input.disabled = true;

  const correct = sessionVocabs[currentIndex].pos;
  const isCorrect = posMeta[correct].accepted.some(a => normalize(a) === typed);

  revealPosTag(correct);
  const feedbackEl = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    input.classList.add('correct');
    feedbackEl.className = 'ok';
    feedbackEl.innerText = 'Benar! Hebat 👏';
  } else {
    input.classList.add('wrong');
    feedbackEl.className = 'no';
    feedbackEl.innerText = `Kurang tepat. Jawaban benar: ${correct}`;
  }

  document.getElementById('score').innerText = score;
  document.getElementById('btn-next').style.display = 'block';
}

function submitFull(){
  if (answered) return;
  const posInput = document.getElementById('full-pos');
  const idInput = document.getElementById('full-id');
  const typedPos = normalize(posInput.value);
  const typedId = normalize(idInput.value);
  if (!typedPos || !typedId) { (typedPos ? idInput : posInput).focus(); return; }

  answered = true;
  document.getElementById('mode-mc').disabled = true;
  document.getElementById('mode-type').disabled = true;
  document.getElementById('mode-noid').disabled = true;
  document.getElementById('mode-full').disabled = true;
  document.getElementById('full-submit').disabled = true;
  posInput.disabled = true;
  idInput.disabled = true;

  const currentData = sessionVocabs[currentIndex];
  const correct = currentData.pos;
  const posOk = posMeta[correct].accepted.some(a => normalize(a) === typedPos);
  const idOk = acceptedMeanings(currentData.id).includes(typedId);

  posInput.classList.add(posOk ? 'correct' : 'wrong');
  idInput.classList.add(idOk ? 'correct' : 'wrong');
  revealPosTag(correct);

  const feedbackEl = document.getElementById('feedback');
  if (posOk && idOk) {
    score++;
    feedbackEl.className = 'ok';
    feedbackEl.innerText = 'Benar semua! Hebat 👏';
  } else {
    feedbackEl.className = 'no';
    const parts = [];
    if (!posOk) parts.push(`part of speech: ${correct}`);
    if (!idOk) parts.push(`arti: ${currentData.id}`);
    feedbackEl.innerText = `Kurang tepat. Jawaban benar — ${parts.join(', ')}`;
  }

  document.getElementById('score').innerText = score;
  document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion(){
  currentIndex++;
  if (currentIndex < sessionVocabs.length) {
    loadQuestion();
  } else {
    showEndScreen();
  }
}

function showEndScreen(){
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'block';
  document.getElementById('finished-session').innerText = currentSession;
  document.getElementById('final-score').innerText = score;
  document.getElementById('max-score').innerText = sessionVocabs.length;

  const circumference = 2 * Math.PI * 62;
  const ring = document.getElementById('ring-fg');
  ring.setAttribute('stroke-dasharray', circumference.toFixed(1));
  const offset = circumference - (score / sessionVocabs.length) * circumference;
  ring.setAttribute('stroke-dashoffset', circumference.toFixed(1));
  requestAnimationFrame(() => { ring.setAttribute('stroke-dashoffset', offset.toFixed(1)); });

  const ratio = score / sessionVocabs.length;
  const note = document.getElementById('end-note');
  note.innerText = ratio >= 0.85 ? 'Mantap, hampir sempurna!' :
                    ratio >= 0.6  ? 'Bagus, terus diasah ya!' :
                    'Latihan lagi biar makin lancar.';

  const actionBtn = document.getElementById('btn-end-action');
  if (currentSession < totalSessions) {
    actionBtn.innerText = `Lanjut ke Sesi ${currentSession + 1} →`;
    actionBtn.onclick = () => { currentSession++; startSession(); };
  } else {
    actionBtn.innerText = `🎉 Semua ${allVocabs.length} kata selesai — ulang dari Sesi 1`;
    actionBtn.onclick = () => { initFullQuiz(); };
  }
}

window.onload = initFullQuiz;
</script>
</body>
