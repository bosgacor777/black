<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Part of Speech Vocab - 200 Kata (4 Sesi)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-sizing: border-box;
            margin: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .score-board {
            font-size: 0.95rem;
            font-weight: bold;
            color: #4b5563;
            margin-bottom: 1.5rem;
            background-color: #e0e7ff;
            padding: 0.6rem;
            border-radius: 0.5rem;
        }

        .card {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .word-id {
            font-size: 1.2rem;
            color: #4b5563;
            font-style: italic;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .btn-option {
            background-color: #ffffff;
            border: 2px solid #d1d5db;
            color: var(--text-color);
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #e0e7ff;
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-option.correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
        }

        .btn-option.wrong {
            background-color: var(--error) !important;
            border-color: var(--error) !important;
            color: white !important;
        }

        #feedback {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            min-height: 1.5rem;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }

        .end-screen {
            display: none;
        }

        .end-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .end-screen p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="quiz-screen">
            <h1>Tebak Part of Speech Vocab</h1>
            <div class="score-board">
                Sesi <span id="current-session">1</span> dari <span id="total-sessions">4</span> | 
                Soal <span id="current-q">1</span>/<span id="total-q">50</span> | 
                Skor: <span id="score">0</span>
            </div>
            
            <div class="card">

                <div class="word-id" id="word-id">Arti: ...</div>
            </div>

            <div class="options-grid" id="options-container"></div>

            <div id="feedback"></div>
            <button class="btn-next" id="btn-next" onclick="nextQuestion()">Pertanyaan Selanjutnya ➔</button>
        </div>

        <div class="end-screen" id="end-screen">
            <h2>Sesi <span id="finished-session">1</span> Selesai! 🎉</h2>
            <p>Skor kamu di sesi ini: <strong style="font-size: 1.5rem;"><span id="final-score">0</span> / <span id="max-score">50</span></strong></p>
            <button class="btn-next" id="btn-end-action" style="display: block; margin-top: 20px;"></button>
        </div>
    </div>

            { en: "Wooden", id: "Dari kayu", pos: "Adjective" }, { en: "Confident", id: "Percaya diri", pos: "Adjective" }, { en: "Weak", id: "Lemah", pos: "Adjective" }, { en: "Strong", id: "Kuat", pos: "Adjective" }, { en: "Lovely", id: "Menawan", pos: "Adjective" },
            { en: "Equal", id: "Setara", pos: "Adjective" }, { en: "Abundant", id: "Berlimpah", pos: "Adjective" }, { en: "Big", id: "Besar", pos: "Adjective" }, { en: "Ashamed", id: "Malu", pos: "Adjective" }, { en: "Young", id: "Muda", pos: "Adjective" },
            { en: "Alone", id: "Sendirian", pos: "Adjective" }, { en: "Dead", id: "Mati", pos: "Adjective" }, { en: "Lush", id: "Subur", pos: "Adjective" }, { en: "Wild", id: "Liar", pos: "Adjective" }, { en: "Dry", id: "Kering", pos: "Adjective" },
            { en: "Confused", id: "Bingung", pos: "Adjective" }, { en: "Mysterious", id: "Misterius", pos: "Adjective" }, { en: "Polite", id: "Sopan", pos: "Adjective" }, { en: "Brave", id: "Berani", pos: "Adjective" }, { en: "Reckless", id: "Ceroboh", pos: "Adjective" },

            // ADVERBS (25)
            { en: "Very", id: "Sangat", pos: "Adverb" }, { en: "Also", id: "Juga", pos: "Adverb" }, { en: "Just", id: "Hanya / Baru saja", pos: "Adverb" }, { en: "Deeply", id: "Sangat dalam", pos: "Adverb" }, { en: "Finally", id: "Akhirnya", pos: "Adverb" },

            { en: "At", id: "Pada / Di", pos: "Preposition" }, { en: "By", id: "Oleh", pos: "Preposition" }, { en: "Around", id: "Di sekeliling", pos: "Preposition" }, { en: "Without", id: "Tanpa", pos: "Preposition" }, { en: "Except", id: "Kecuali", pos: "Preposition" },
            { en: "For", id: "Untuk", pos: "Preposition" }, { en: "Over", id: "Di atas", pos: "Preposition" }, { en: "Toward", id: "Ke arah", pos: "Preposition" }, { en: "Beside", id: "Di samping", pos: "Preposition" }, { en: "Into", id: "Ke dalam", pos: "Preposition" },

            // CONJUNCTIONS (7)
            { en: "But", id: "Tetapi", pos: "Conjunction" }, { en: "And", id: "Dan", pos: "Conjunction" }, { en: "So", id: "Jadi", pos: "Conjunction" }, { en: "However", id: "Namun", pos: "Conjunction" }, { en: "When", id: "Ketika", pos: "Conjunction" },

            // ARTICLES / DETERMINERS (3)
            { en: "A / An", id: "Sebuah / Seorang", pos: "Article / Determiner" }, { en: "The", id: "Itu (Spesifik)", pos: "Article / Determiner" }, { en: "All", id: "Semua", pos: "Article / Determiner" }
        ];

        const allPosOptions = [
            "Noun", "Verb", "Adjective", "Adverb", 
            "Pronoun", "Preposition", "Conjunction", "Article / Determiner"
        ];
        
        const questionsPerSession = 50;
        const totalSessions = 4;

        let masterPool = [];
        let currentSession = 1;
        let sessionVocabs = [];
        let currentIndex = 0;
        let score = 0;

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initFullQuiz() {
            masterPool = shuffle(allVocabs); // Acak total 200 kata
            currentSession = 1;
            startSession();
        }

        function startSession() {
            const startIdx = (currentSession - 1) * questionsPerSession;
            const endIdx = startIdx + questionsPerSession;
            
            // Ambil 50 kata khusus untuk sesi ini lalu diacak urutannya
            sessionVocabs = shuffle(masterPool.slice(startIdx, endIdx));
            
            currentIndex = 0;
            score = 0;

            document.getElementById('current-session').innerText = currentSession;
            document.getElementById('total-sessions').innerText = totalSessions;
            document.getElementById('total-q').innerText = questionsPerSession;
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('end-screen').style.display = 'none';
            
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('btn-next').style.display = 'none';
            
            const currentData = sessionVocabs[currentIndex];
            document.getElementById('current-q').innerText = currentIndex + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('word-en').innerText = currentData.en;
            document.getElementById('word-id').innerText = `Arti: ${currentData.id}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            allPosOptions.forEach(pos => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = pos;
                btn.onclick = () => selectAnswer(pos, currentData.pos, btn);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selected, correct, selectedBtn) {
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correct) {
                    btn.classList.add('correct');
                }
            });

            const feedbackEl = document.getElementById('feedback');
            if (selected === correct) {
                score++;
                feedbackEl.style.color = 'var(--success)';
                feedbackEl.innerText = 'Benar! Hebat 👏';
            } else {
                selectedBtn.classList.add('wrong');
                feedbackEl.style.color = 'var(--error)';
                feedbackEl.innerText = `Jawaban benar: ${correct}`;
            }

            document.getElementById('score').innerText = score;
            document.getElementById('btn-next').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < sessionVocabs.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('finished-session').innerText = currentSession;
            document.getElementById('final-score').innerText = score;
            document.getElementById('max-score').innerText = questionsPerSession;

            const actionBtn = document.getElementById('btn-end-action');
            
            if (currentSession < totalSessions) {
                actionBtn.innerText = `Lanjut ke Sesi ${currentSession + 1} (50 Kata Baru) ➔`;
                actionBtn.onclick = () => {
                    currentSession++;
                    startSession();
                };
            } else {
                actionBtn.innerText = `🎉 Kamu Sudah Mempelajari Semua 200 Kata! Ulang dari Sesi 1 🔄`;
                actionBtn.onclick = () => {
                    initFullQuiz();
                };
            }
        }

        // Mulai kuis dari awal saat halaman dibuka
        window.onload = initFullQuiz;
    </script>

</html>
